const P={
"pt-BR":{n:"Português (Brasil)",t:"Política de Privacidade|Reverse Ring",d:"Última atualização: 10 de outubro de 2026",h:["Sobre esta política","Dados e publicidade","Contas, retenção e contato"],p:["Esta política explica como o jogo Android <strong>Reverse Ring</strong>, pacote <strong>com.adrianobr.reversering</strong>, trata informações durante o uso.","O jogo armazena no aparelho preferências de som, vibração e animações, estatísticas e melhor pontuação. Esses dados não são enviados pelo código próprio do jogo a um servidor do desenvolvedor. Para anúncios intersticiais e recompensados, o app usa Google Mobile Ads. Esse serviço pode tratar endereço IP, localização aproximada derivada do IP, interações no app, dados de diagnóstico e identificadores do dispositivo para exibir e medir anúncios, análise, segurança e prevenção de fraude. O tratamento depende das configurações e do consentimento aplicável. Consulte a <a href='https://policies.google.com/privacy'>Política de Privacidade do Google</a>.","O app usa internet para carregar anúncios e pode usar vibração como resposta tátil. Não exige cadastro, login nem conta; não oferece chat, publicação de conteúdo ou envio de arquivos. Os dados locais permanecem no aparelho até você limpar os dados do app ou desinstalá-lo. Não existe conta do jogo ou banco de dados próprio de usuários a excluir. Para dúvidas de privacidade, escreva para <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Esta política pode ser atualizada quando o jogo, os serviços ou as regras aplicáveis mudarem."]},
"pt-PT":{n:"Português (Portugal)",t:"Política de Privacidade|Reverse Ring",d:"Última atualização: 10 de outubro de 2026",h:["Sobre esta política","Dados e publicidade","Contas, conservação e contacto"],p:["Esta política explica como o jogo Android <strong>Reverse Ring</strong>, pacote <strong>com.adrianobr.reversering</strong>, trata informações durante a utilização.","O jogo guarda no dispositivo preferências de som, vibração e animações, estatísticas e melhor pontuação. Estes dados não são enviados pelo código próprio do jogo para um servidor do programador. Para anúncios intersticiais e recompensados, a app usa Google Mobile Ads, que pode tratar endereço IP, localização aproximada derivada do IP, interações na app, diagnósticos e identificadores do dispositivo para publicidade, análise, segurança e prevenção de fraude. O tratamento depende das definições e consentimento aplicáveis. Consulte a <a href='https://policies.google.com/privacy'>Política de Privacidade da Google</a>.","A app usa internet para carregar anúncios e pode usar vibração como resposta tátil. Não exige registo, início de sessão ou conta e não oferece chat, publicação de conteúdo ou envio de ficheiros. Os dados locais permanecem até limpar os dados ou desinstalar a app. Não existe conta de jogo a eliminar. Para dúvidas, contacte <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Esta política pode ser atualizada."]},
"en-US":{n:"English",t:"Privacy Policy|Reverse Ring",d:"Last updated: October 10, 2026",h:["About this policy","Data and advertising","Accounts, retention, and contact"],p:["This policy explains how the Android game <strong>Reverse Ring</strong>, package <strong>com.adrianobr.reversering</strong>, handles information while you use it.","The game stores sound, vibration, and animation preferences, statistics, and best score on your device. This information is not sent by the game's own code to a developer server. For interstitial and rewarded ads, the app uses Google Mobile Ads. That service may process IP address, approximate location derived from IP, in-app interactions, diagnostics, and device identifiers for ad delivery and measurement, analytics, security, and fraud prevention. Processing depends on applicable settings and consent. See <a href='https://policies.google.com/privacy'>Google's Privacy Policy</a>.","The app uses internet to load ads and may use vibration for haptic feedback. It requires no registration, sign-in, or account and offers no chat, user content publishing, or file uploads. Local data remains until you clear app data or uninstall. There is no game account or developer user database to delete. For privacy questions, contact <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. This policy may be updated."]},
"es-419":{n:"Español",t:"Política de privacidad|Reverse Ring",d:"Última actualización: 10 de octubre de 2026",h:["Acerca de esta política","Datos y publicidad","Cuentas, conservación y contacto"],p:["Esta política explica cómo el juego Android <strong>Reverse Ring</strong>, paquete <strong>com.adrianobr.reversering</strong>, trata la información durante su uso.","El juego guarda en el dispositivo preferencias de sonido, vibración y animaciones, estadísticas y mejor puntuación. Estos datos no se envían mediante el código propio del juego a un servidor del desarrollador. Para anuncios intersticiales y recompensados usa Google Mobile Ads, que puede tratar dirección IP, ubicación aproximada derivada de la IP, interacciones en la app, diagnósticos e identificadores del dispositivo para publicidad, análisis, seguridad y prevención de fraude. El tratamiento depende de la configuración y el consentimiento aplicable. Consulte la <a href='https://policies.google.com/privacy'>Política de privacidad de Google</a>.","La app usa internet para cargar anuncios y puede usar vibración como respuesta táctil. No requiere registro, inicio de sesión ni cuenta; no ofrece chat, publicación de contenido ni carga de archivos. Los datos locales permanecen hasta borrar los datos o desinstalar la app. Para consultas, escriba a <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Esta política puede actualizarse."]},
"fr-FR":{n:"Français",t:"Politique de confidentialité|Reverse Ring",d:"Dernière mise à jour : 10 octobre 2026",h:["À propos de cette politique","Données et publicité","Comptes, conservation et contact"],p:["Cette politique explique comment le jeu Android <strong>Reverse Ring</strong>, package <strong>com.adrianobr.reversering</strong>, traite les informations pendant son utilisation.","Le jeu enregistre sur l’appareil les préférences de son, de vibration et d’animation, les statistiques et le meilleur score. Ces données ne sont pas envoyées par le code propre du jeu vers un serveur du développeur. Pour les annonces interstitielles et récompensées, l’app utilise Google Mobile Ads, qui peut traiter l’adresse IP, une localisation approximative dérivée de l’IP, les interactions, diagnostics et identifiants de l’appareil à des fins publicitaires, d’analyse, de sécurité et de prévention de la fraude. Le traitement dépend des paramètres et du consentement. Consultez la <a href='https://policies.google.com/privacy'>Politique de confidentialité de Google</a>.","L’app utilise Internet pour charger les annonces et peut utiliser la vibration comme retour haptique. Elle ne demande ni inscription, ni connexion, ni compte et ne propose ni chat, ni publication, ni envoi de fichiers. Les données locales restent jusqu’à l’effacement des données ou la désinstallation. Contact : <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Cette politique peut être mise à jour."]},
"de-DE":{n:"Deutsch",t:"Datenschutzerklärung|Reverse Ring",d:"Zuletzt aktualisiert: 10. Oktober 2026",h:["Über diese Erklärung","Daten und Werbung","Konten, Speicherung und Kontakt"],p:["Diese Erklärung erläutert, wie das Android-Spiel <strong>Reverse Ring</strong>, Paket <strong>com.adrianobr.reversering</strong>, Informationen bei der Nutzung verarbeitet.","Das Spiel speichert Ton-, Vibrations- und Animationseinstellungen, Statistiken und Bestwert auf dem Gerät. Diese Daten werden nicht durch den eigenen Spielcode an einen Entwickler-Server gesendet. Für Interstitial- und Belohnungsanzeigen nutzt die App Google Mobile Ads. Der Dienst kann IP-Adresse, daraus abgeleiteten ungefähren Standort, App-Interaktionen, Diagnosedaten und Gerätekennungen für Werbung, Analyse, Sicherheit und Betrugsprävention verarbeiten. Die Verarbeitung hängt von Einstellungen und Einwilligung ab. Siehe <a href='https://policies.google.com/privacy'>Datenschutzerklärung von Google</a>.","Die App nutzt Internet zum Laden von Anzeigen und kann Vibration als haptische Rückmeldung verwenden. Sie benötigt keine Registrierung, Anmeldung oder Konto und bietet keinen Chat, keine Veröffentlichungen und keine Datei-Uploads. Lokale Daten bleiben bis zur Datenlöschung oder Deinstallation. Kontakt: <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Diese Erklärung kann aktualisiert werden."]},
"it-IT":{n:"Italiano",t:"Informativa sulla privacy|Reverse Ring",d:"Ultimo aggiornamento: 10 ottobre 2026",h:["Informazioni su questa informativa","Dati e pubblicità","Account, conservazione e contatti"],p:["Questa informativa spiega come il gioco Android <strong>Reverse Ring</strong>, pacchetto <strong>com.adrianobr.reversering</strong>, tratta le informazioni durante l’uso.","Il gioco salva sul dispositivo preferenze di suono, vibrazione e animazioni, statistiche e punteggio migliore. Questi dati non vengono inviati dal codice del gioco a un server dello sviluppatore. Per annunci interstitial e con premio l’app usa Google Mobile Ads, che può trattare indirizzo IP, posizione approssimativa derivata dall’IP, interazioni, diagnostica e identificatori del dispositivo per pubblicità, analisi, sicurezza e prevenzione delle frodi. Il trattamento dipende da impostazioni e consenso applicabili. Consulta l’<a href='https://policies.google.com/privacy'>Informativa sulla privacy di Google</a>.","L’app usa Internet per caricare gli annunci e può usare la vibrazione come feedback tattile. Non richiede registrazione, accesso o account e non offre chat, pubblicazione di contenuti o caricamento di file. I dati locali restano fino alla cancellazione o disinstallazione. Contatto: <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Questa informativa può essere aggiornata."]},
"hi-IN":{n:"हिन्दी",t:"गोपनीयता नीति|Reverse Ring",d:"अंतिम अपडेट: 10 अक्टूबर 2026",h:["इस नीति के बारे में","डेटा और विज्ञापन","खाते, संग्रह और संपर्क"],p:["यह नीति बताती है कि Android गेम <strong>Reverse Ring</strong>, पैकेज <strong>com.adrianobr.reversering</strong>, उपयोग के दौरान जानकारी को कैसे संभालता है।","गेम ध्वनि, कंपन और एनीमेशन की पसंद, आँकड़े और सर्वोत्तम स्कोर डिवाइस पर सहेजता है। ये डेटा गेम के अपने कोड द्वारा डेवलपर सर्वर को नहीं भेजे जाते। इंटरस्टिशियल और रिवॉर्डेड विज्ञापनों के लिए ऐप Google Mobile Ads का उपयोग करता है। सेवा विज्ञापन, विश्लेषण, सुरक्षा और धोखाधड़ी रोकने के लिए IP पता, IP से प्राप्त अनुमानित स्थान, ऐप इंटरैक्शन, निदान और डिवाइस पहचानकर्ता संसाधित कर सकती है। यह लागू सेटिंग और सहमति पर निर्भर है। <a href='https://policies.google.com/privacy'>Google की गोपनीयता नीति</a> देखें।","ऐप विज्ञापन लोड करने के लिए इंटरनेट और हैप्टिक फीडबैक के लिए कंपन का उपयोग कर सकता है। पंजीकरण, साइन-इन या खाते की आवश्यकता नहीं है। स्थानीय डेटा साफ़ करने या ऐप हटाने तक रहता है। संपर्क: <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>। यह नीति अपडेट हो सकती है।"]},
"id":{n:"Bahasa Indonesia",t:"Kebijakan Privasi|Reverse Ring",d:"Terakhir diperbarui: 10 Oktober 2026",h:["Tentang kebijakan ini","Data dan iklan","Akun, penyimpanan, dan kontak"],p:["Kebijakan ini menjelaskan cara game Android <strong>Reverse Ring</strong>, paket <strong>com.adrianobr.reversering</strong>, menangani informasi saat digunakan.","Game menyimpan preferensi suara, getaran, animasi, statistik, dan skor terbaik di perangkat. Data ini tidak dikirim oleh kode game ke server pengembang. Untuk iklan interstisial dan berhadiah, aplikasi menggunakan Google Mobile Ads. Layanan tersebut dapat memproses alamat IP, lokasi perkiraan dari IP, interaksi aplikasi, diagnostik, dan pengenal perangkat untuk iklan, analitik, keamanan, dan pencegahan penipuan. Pemrosesan bergantung pada pengaturan dan persetujuan. Lihat <a href='https://policies.google.com/privacy'>Kebijakan Privasi Google</a>.","Aplikasi menggunakan internet untuk memuat iklan dan dapat memakai getaran sebagai umpan balik haptik. Tidak ada pendaftaran, login, atau akun. Data lokal tersimpan hingga data dihapus atau aplikasi dicopot. Kontak: <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Kebijakan ini dapat diperbarui."]},
"ru-RU":{n:"Русский",t:"Политика конфиденциальности|Reverse Ring",d:"Последнее обновление: 10 октября 2026 г.",h:["Об этой политике","Данные и реклама","Учётные записи, хранение и контакты"],p:["Эта политика объясняет, как Android-игра <strong>Reverse Ring</strong>, пакет <strong>com.adrianobr.reversering</strong>, обрабатывает информацию при использовании.","Игра хранит на устройстве настройки звука, вибрации и анимации, статистику и лучший результат. Эти данные не отправляются кодом игры на сервер разработчика. Для межстраничной и вознаграждаемой рекламы приложение использует Google Mobile Ads. Сервис может обрабатывать IP-адрес, приблизительное местоположение на основе IP, взаимодействия, диагностику и идентификаторы устройства для рекламы, аналитики, безопасности и предотвращения мошенничества. Обработка зависит от настроек и согласия. См. <a href='https://policies.google.com/privacy'>Политику конфиденциальности Google</a>.","Приложение использует интернет для загрузки рекламы и может использовать вибрацию. Регистрация, вход и аккаунт не требуются. Локальные данные остаются до очистки или удаления приложения. Контакт: <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Политика может обновляться."]},
"tr-TR":{n:"Türkçe",t:"Gizlilik Politikası|Reverse Ring",d:"Son güncelleme: 10 Ekim 2026",h:["Bu politika hakkında","Veriler ve reklamlar","Hesaplar, saklama ve iletişim"],p:["Bu politika, Android oyunu <strong>Reverse Ring</strong>, paket <strong>com.adrianobr.reversering</strong> kullanım sırasında bilgileri nasıl işlediğini açıklar.","Oyun ses, titreşim ve animasyon tercihlerini, istatistikleri ve en iyi skoru cihazda saklar. Bu veriler oyun kodu tarafından geliştirici sunucusuna gönderilmez. Geçiş ve ödüllü reklamlar için uygulama Google Mobile Ads kullanır. Hizmet reklam, analiz, güvenlik ve sahtekârlığı önleme amacıyla IP adresi, IP’den türetilen yaklaşık konum, uygulama etkileşimleri, tanılama verileri ve cihaz tanımlayıcılarını işleyebilir. İşleme, ayarlara ve izne bağlıdır. <a href='https://policies.google.com/privacy'>Google Gizlilik Politikası</a>'na bakın.","Uygulama reklam yüklemek için interneti kullanır ve titreşimi kullanabilir. Kayıt, oturum açma veya hesap gerekmez. Yerel veriler temizlenene veya uygulama kaldırılana kadar kalır. İletişim: <a href='mailto:contact@adrianobr.com'>contact@adrianobr.com</a>. Bu politika güncellenebilir."]}
};
const s=document.getElementById('language');Object.entries(P).forEach(([k,v])=>s.add(new Option(v.n,k)));
function show(k){const v=P[k];document.documentElement.lang=k;document.title=v.t.replace('|',' — ');document.getElementById('title').innerHTML=v.t.replace('|','<br><span>')+'</span>';document.getElementById('date').textContent=v.d;document.getElementById('content').innerHTML=v.h.map((x,i)=>'<h2>'+x+'</h2><p>'+v.p[i]+'</p>').join('');localStorage.setItem('rr-privacy-lang',k)}
const b=navigator.language; s.value=(localStorage.getItem('rr-privacy-lang')&&P[localStorage.getItem('rr-privacy-lang')])?localStorage.getItem('rr-privacy-lang'):(P[b]?b:(b.startsWith('pt')?'pt-BR':P[b.slice(0,2)]?b.slice(0,2):'en-US'));show(s.value);s.onchange=e=>show(e.target.value);
</script>
