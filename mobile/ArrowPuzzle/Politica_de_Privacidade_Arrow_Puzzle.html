en:{lang:'en',title:'Privacy Policy',updated:'Last updated: 9 October 2026',intro:'This Privacy Policy explains how Arrow Puzzle (package com.adrianobr.arrowpuzzle) handles information when you use the game.',sections:[
['1. Controller and scope','Arrow Puzzle is provided by Adriano Bezerra. The game does not require an account, login, or registration, and the developer does not operate a game backend.'],
['2. Data stored on your device','The game stores progress, unlocked levels and results, coins, lives, boosters, inventory, preferences, privacy-consent choices, and any in-app feedback locally on your device. This information is used to run the game and is not sent to the developer’s own server. You may erase it by clearing the app storage or uninstalling the app.'],
['3. Advertising and consent','Arrow Puzzle shows a banner during gameplay and offers optional rewarded ads only when you choose to recover a life after Game Over, earn coins after a level, or obtain 100 coins in the shop. It does not show automatic interstitial ads while navigating screens or levels. Advertising is provided by Google AdMob. Where required, you can review or change your choices in Eu → Privacy preferences → Manage consent.'],
['4. Information processed by Google AdMob','Google and AdMob may collect and/or share technical information, such as approximate location inferred from IP address, ad and app interactions, diagnostics and performance information, and device or advertising identifiers. This may be used for advertising, measurement and analytics, security, fraud prevention, and legal compliance. Transmission is protected in transit. Learn more in the <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a> and <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">Google advertising information</a>.'],
['5. Purchases','Optional purchases are processed by Google Play. The developer may receive the product identifier, transaction status, and technical purchase or order identifiers needed to grant and validate the item. The game does not receive or store your full payment-card or banking information.'],
['6. Contact, feedback, reviews and sharing','Contact opens your email app with the recipient pre-filled as contact@adrianobr.com; you decide whether to send a message. Feedback is stored locally. The review option opens Google Play, and sharing opens the Android sharing menu only after you choose it.'],
['7. Retention, security and your rights','Local game data remains on your device until you delete it. Google retains data according to its own policies. You may ask questions or exercise applicable privacy rights, including rights under the LGPD where applicable, by emailing contact@adrianobr.com.'],
['8. Children, changes and contact','The game is intended for a general audience, does not intentionally collect personal data from children, and has no user accounts. This policy may be updated when the game changes. Questions: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
ptBR:{lang:'pt-BR',title:'Política de Privacidade',updated:'Última atualização: 9 de outubro de 2026',intro:'Esta Política de Privacidade explica como o Arrow Puzzle (pacote com.adrianobr.arrowpuzzle) trata informações durante o uso do jogo.',sections:[
['1. Responsável e escopo','Arrow Puzzle é fornecido por Adriano Bezerra. O jogo não exige conta, login ou cadastro, e o desenvolvedor não mantém um servidor próprio do jogo.'],
['2. Dados armazenados no dispositivo','O jogo armazena localmente no seu dispositivo o progresso, níveis e resultados desbloqueados, moedas, vidas, boosters, inventário, preferências, escolhas de consentimento de privacidade e eventuais feedbacks enviados pelo app. Essas informações são usadas para o funcionamento do jogo e não são enviadas a um servidor próprio do desenvolvedor. Você pode apagá-las limpando os dados do app ou desinstalando-o.'],
['3. Publicidade e consentimento','O Arrow Puzzle exibe um banner durante a jogabilidade e oferece anúncios recompensados opcionais somente quando você escolhe recuperar uma vida após o Game Over, ganhar moedas após um nível ou obter 100 moedas na Loja. Não há anúncios intersticiais automáticos ao navegar entre telas ou níveis. A publicidade é fornecida pelo Google AdMob. Quando aplicável, você pode revisar ou alterar suas escolhas em Eu → Preferências de privacidade → Gerenciar consentimento.'],
['4. Informações processadas pelo Google AdMob','O Google e o AdMob podem coletar e/ou compartilhar informações técnicas, como localização aproximada inferida pelo endereço IP, interações com anúncios e app, diagnósticos e desempenho, além de identificadores do dispositivo ou de publicidade. Esses dados podem ser usados para publicidade, medição e análise, segurança, prevenção a fraudes e conformidade legal. A transmissão é protegida em trânsito. Consulte a <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Política de Privacidade do Google</a> e as <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">informações sobre anúncios do Google</a>.'],
['5. Compras','Compras opcionais são processadas pelo Google Play. O desenvolvedor pode receber o identificador do produto, o status da transação e identificadores técnicos de compra ou pedido necessários para conceder e validar o item. O jogo não recebe nem armazena dados completos de cartão ou bancários.'],
['6. Contato, feedback, avaliações e compartilhamento','Contato abre seu aplicativo de e-mail com o destinatário contact@adrianobr.com preenchido; você decide se envia a mensagem. O feedback fica armazenado localmente. A opção de avaliação abre o Google Play, e o compartilhamento abre o menu do Android apenas quando você escolhe usá-lo.'],
['7. Retenção, segurança e direitos','Os dados locais do jogo permanecem no dispositivo até que você os exclua. O Google retém dados conforme suas próprias políticas. Você pode tirar dúvidas ou exercer direitos aplicáveis de privacidade, inclusive os previstos na LGPD quando cabíveis, pelo e-mail contact@adrianobr.com.'],
['8. Crianças, alterações e contato','O jogo é destinado ao público geral, não coleta intencionalmente dados pessoais de crianças e não possui contas de usuário. Esta política poderá ser atualizada quando o jogo mudar. Dúvidas: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},

['5. Compras','As compras opcionais são processadas pelo Google Play. O programador pode receber o identificador do produto, o estado da transação e identificadores técnicos da compra ou encomenda necessários para conceder e validar o item. O jogo não recebe nem guarda dados completos de cartão ou dados bancários.'],

['7. Conservação, segurança e direitos','Os dados locais permanecem no dispositivo até serem eliminados. A Google conserva dados segundo as suas próprias políticas. Pode colocar questões ou exercer direitos de privacidade aplicáveis pelo e-mail contact@adrianobr.com.'],
['8. Crianças, alterações e contacto','O jogo destina-se ao público geral, não recolhe intencionalmente dados pessoais de crianças e não possui contas de utilizador. Esta política pode ser atualizada quando o jogo mudar. Contacto: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
es:{lang:'es',title:'Política de privacidad',updated:'Última actualización: 9 de octubre de 2026',intro:'Esta Política de privacidad explica cómo Arrow Puzzle (paquete com.adrianobr.arrowpuzzle) trata la información cuando usas el juego.',sections:[

['3. Publicidad y consentimiento','Arrow Puzzle muestra un banner durante la partida y ofrece anuncios recompensados opcionales solo cuando eliges recuperar una vida tras Game Over, ganar monedas después de un nivel u obtener 100 monedas en la tienda. No muestra anuncios intersticiales automáticos al navegar entre pantallas o niveles. La publicidad la proporciona Google AdMob. Cuando corresponda, puedes revisar o cambiar tus elecciones en Yo → Preferencias de privacidad → Administrar consentimiento.'],
['4. Información procesada por Google AdMob','Google y AdMob pueden recopilar o compartir información técnica, como ubicación aproximada deducida de la IP, interacciones con anuncios y app, diagnósticos y rendimiento, e identificadores del dispositivo o de publicidad. Puede utilizarse para publicidad, medición y análisis, seguridad, prevención de fraude y cumplimiento legal. La transmisión está protegida. Consulta la <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Política de privacidad de Google</a> y la <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">información sobre anuncios de Google</a>.'],
['5. Compras','Las compras opcionales son procesadas por Google Play. El desarrollador puede recibir el identificador del producto, estado de la transacción e identificadores técnicos de compra o pedido necesarios para conceder y validar el artículo. El juego no recibe ni almacena datos completos de tarjetas ni bancarios.'],
['6. Contacto, comentarios, reseñas y compartir','Contacto abre tu aplicación de correo con contact@adrianobr.com ya indicado; tú decides si envías el mensaje. Los comentarios se guardan localmente. La reseña abre Google Play y compartir abre el menú de Android solo cuando lo eliges.'],
['7. Conservación, seguridad y derechos','Los datos locales permanecen en el dispositivo hasta que los elimines. Google conserva datos conforme a sus propias políticas. Puedes hacer preguntas o ejercer derechos de privacidad aplicables escribiendo a contact@adrianobr.com.'],
['8. Menores, cambios y contacto','El juego está destinado al público general, no recopila intencionalmente datos personales de menores y no tiene cuentas de usuario. Esta política puede actualizarse cuando cambie el juego. Contacto: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
fr:{lang:'fr',title:'Politique de confidentialité',updated:'Dernière mise à jour : 9 octobre 2026',intro:'La présente Politique explique comment Arrow Puzzle (package com.adrianobr.arrowpuzzle) traite les informations lorsque vous utilisez le jeu.',sections:[
['1. Responsable et portée','Arrow Puzzle est fourni par Adriano Bezerra. Le jeu ne demande ni compte, ni connexion, ni inscription, et le développeur n’exploite pas de serveur de jeu propre.'],
['2. Données stockées sur l’appareil','Le jeu enregistre localement sur votre appareil votre progression, niveaux et résultats débloqués, pièces, vies, bonus, inventaire, préférences, choix de consentement et éventuels retours envoyés dans l’application. Ces informations servent au fonctionnement du jeu et ne sont pas envoyées vers un serveur propre au développeur. Vous pouvez les effacer en supprimant les données de l’application ou en la désinstallant.'],
['3. Publicité et consentement','Arrow Puzzle affiche une bannière pendant le jeu et propose des publicités récompensées facultatives uniquement lorsque vous choisissez de récupérer une vie après Game Over, gagner des pièces après un niveau ou obtenir 100 pièces dans la boutique. Aucune publicité interstitielle automatique n’est affichée lors de la navigation entre écrans ou niveaux. La publicité est fournie par Google AdMob. Lorsque nécessaire, vous pouvez revoir vos choix dans Moi → Préférences de confidentialité → Gérer le consentement.'],
['4. Informations traitées par Google AdMob','Google et AdMob peuvent collecter et/ou partager des informations techniques, notamment la localisation approximative déduite de l’adresse IP, les interactions avec les publicités et l’application, les diagnostics et performances, ainsi que les identifiants d’appareil ou publicitaires. Elles peuvent servir à la publicité, la mesure et l’analyse, la sécurité, la prévention de la fraude et la conformité légale. La transmission est protégée. Consultez la <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Politique de confidentialité Google</a> et les <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">informations Google sur les annonces</a>.'],
['5. Achats','Les achats facultatifs sont traités par Google Play. Le développeur peut recevoir l’identifiant du produit, l’état de la transaction et les identifiants techniques d’achat ou de commande nécessaires pour attribuer et valider l’article. Le jeu ne reçoit ni ne conserve vos données complètes de carte ou bancaires.'],
['6. Contact, retours, avis et partage','Contact ouvre votre application e-mail avec contact@adrianobr.com prérempli ; vous décidez d’envoyer ou non le message. Les retours sont conservés localement. L’avis ouvre Google Play et le partage ouvre le menu Android uniquement lorsque vous le choisissez.'],
['7. Conservation, sécurité et droits','Les données locales restent sur votre appareil jusqu’à leur suppression. Google conserve les données selon ses propres règles. Vous pouvez poser des questions ou exercer les droits applicables en matière de confidentialité à contact@adrianobr.com.'],
['8. Enfants, changements et contact','Le jeu s’adresse à tout public, ne collecte pas intentionnellement de données personnelles d’enfants et ne possède pas de comptes utilisateur. Cette politique peut être mise à jour si le jeu évolue. Contact : <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
de:{lang:'de',title:'Datenschutzerklärung',updated:'Letzte Aktualisierung: 9. Oktober 2026',intro:'Diese Datenschutzerklärung erläutert, wie Arrow Puzzle (Paket com.adrianobr.arrowpuzzle) Informationen verarbeitet, wenn Sie das Spiel nutzen.',sections:[
['1. Verantwortlicher und Geltungsbereich','Arrow Puzzle wird von Adriano Bezerra bereitgestellt. Das Spiel erfordert kein Konto, keine Anmeldung und keine Registrierung; der Entwickler betreibt keinen eigenen Spielserver.'],
['2. Auf dem Gerät gespeicherte Daten','Das Spiel speichert Fortschritt, freigeschaltete Level und Ergebnisse, Münzen, Leben, Booster, Inventar, Einstellungen, Einwilligungsentscheidungen und eventuelles In-App-Feedback lokal auf Ihrem Gerät. Diese Informationen werden für die Spielfunktion verwendet und nicht an einen eigenen Server des Entwicklers übertragen. Sie können sie löschen, indem Sie die App-Daten löschen oder die App deinstallieren.'],
['3. Werbung und Einwilligung','Arrow Puzzle zeigt während des Spiels ein Banner und bietet optionale belohnte Werbung nur an, wenn Sie nach Game Over ein Leben wiederherstellen, nach einem Level Münzen verdienen oder im Shop 100 Münzen erhalten möchten. Beim Wechsel zwischen Bildschirmen oder Levels werden keine automatischen Interstitial-Anzeigen gezeigt. Werbung wird von Google AdMob bereitgestellt. Soweit erforderlich können Sie Ihre Auswahl unter Ich → Datenschutzeinstellungen → Einwilligung verwalten prüfen oder ändern.'],
['4. Von Google AdMob verarbeitete Informationen','Google und AdMob können technische Informationen erfassen und/oder weitergeben, darunter aus der IP-Adresse abgeleiteter ungefährer Standort, Interaktionen mit App und Anzeigen, Diagnose- und Leistungsdaten sowie Geräte- oder Werbe-IDs. Dies kann für Werbung, Messung und Analyse, Sicherheit, Betrugsprävention und Rechtskonformität verwendet werden. Die Übertragung ist geschützt. Weitere Informationen: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google-Datenschutzerklärung</a> und <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">Google-Informationen zu Anzeigen</a>.'],
['5. Käufe','Optionale Käufe werden über Google Play verarbeitet. Der Entwickler kann Produktkennung, Transaktionsstatus und technische Kauf- oder Bestellkennungen erhalten, die zur Gewährung und Validierung des Artikels nötig sind. Das Spiel erhält oder speichert keine vollständigen Karten- oder Bankdaten.'],
['6. Kontakt, Feedback, Bewertungen und Teilen','Kontakt öffnet Ihre E-Mail-App mit contact@adrianobr.com als Empfänger; Sie entscheiden selbst, ob Sie die Nachricht senden. Feedback wird lokal gespeichert. Bewertungen öffnen Google Play, und Teilen öffnet das Android-Menü nur auf Ihre Auswahl hin.'],
['7. Aufbewahrung, Sicherheit und Rechte','Lokale Spieldaten bleiben bis zur Löschung auf Ihrem Gerät. Google bewahrt Daten nach eigenen Richtlinien auf. Fragen oder anwendbare Datenschutzrechte können Sie über contact@adrianobr.com geltend machen.'],
['8. Kinder, Änderungen und Kontakt','Das Spiel richtet sich an ein allgemeines Publikum, erhebt nicht absichtlich personenbezogene Daten von Kindern und hat keine Nutzerkonten. Diese Erklärung kann bei Änderungen am Spiel aktualisiert werden. Kontakt: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
it:{lang:'it',title:'Informativa sulla privacy',updated:'Ultimo aggiornamento: 9 ottobre 2026',intro:'Questa Informativa spiega come Arrow Puzzle (pacchetto com.adrianobr.arrowpuzzle) tratta le informazioni quando utilizzi il gioco.',sections:[
['1. Titolare e ambito','Arrow Puzzle è fornito da Adriano Bezerra. Il gioco non richiede account, accesso o registrazione e lo sviluppatore non gestisce un proprio server di gioco.'],
['2. Dati memorizzati sul dispositivo','Il gioco memorizza localmente sul dispositivo progressi, livelli e risultati sbloccati, monete, vite, potenziamenti, inventario, preferenze, scelte di consenso e eventuali feedback inviati nell’app. Queste informazioni sono utilizzate per far funzionare il gioco e non vengono inviate a un server proprio dello sviluppatore. Puoi eliminarle cancellando i dati dell’app o disinstallandola.'],
['3. Pubblicità e consenso','Arrow Puzzle mostra un banner durante il gioco e offre annunci con premio facoltativi solo quando scegli di recuperare una vita dopo Game Over, ottenere monete dopo un livello o ricevere 100 monete nel negozio. Non mostra annunci interstitial automatici durante la navigazione tra schermate o livelli. La pubblicità è fornita da Google AdMob. Ove necessario puoi rivedere o modificare le scelte in Io → Preferenze privacy → Gestisci consenso.'],
['4. Informazioni trattate da Google AdMob','Google e AdMob possono raccogliere e/o condividere informazioni tecniche, quali posizione approssimativa dedotta dall’IP, interazioni con app e annunci, diagnostica e prestazioni, nonché identificatori del dispositivo o pubblicitari. Possono essere usate per pubblicità, misurazione e analisi, sicurezza, prevenzione frodi e conformità legale. La trasmissione è protetta. Consulta l’<a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Informativa Google</a> e le <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">informazioni sugli annunci Google</a>.'],
['5. Acquisti','Gli acquisti facoltativi sono elaborati da Google Play. Lo sviluppatore può ricevere identificativo del prodotto, stato della transazione e identificativi tecnici di acquisto o ordine necessari per assegnare e convalidare l’articolo. Il gioco non riceve né memorizza dati completi di carta o bancari.'],
['6. Contatto, feedback, recensioni e condivisione','Contatto apre l’app e-mail con contact@adrianobr.com precompilato; decidi tu se inviare il messaggio. Il feedback è salvato localmente. Le recensioni aprono Google Play e la condivisione apre il menu Android solo quando lo scegli.'],
['7. Conservazione, sicurezza e diritti','I dati locali restano sul dispositivo finché non li elimini. Google conserva i dati secondo le proprie politiche. Puoi porre domande o esercitare i diritti privacy applicabili scrivendo a contact@adrianobr.com.'],
['8. Minori, modifiche e contatto','Il gioco è destinato a un pubblico generale, non raccoglie intenzionalmente dati personali di minori e non dispone di account utente. Questa informativa può essere aggiornata in caso di modifiche al gioco. Contatto: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
hi:{lang:'hi',title:'गोपनीयता नीति',updated:'अंतिम अपडेट: 9 अक्टूबर 2026',intro:'यह गोपनीयता नीति बताती है कि Arrow Puzzle (पैकेज com.adrianobr.arrowpuzzle) खेल उपयोग करने पर जानकारी को कैसे संभालता है।',sections:[
['1. नियंत्रक और दायरा','Arrow Puzzle Adriano Bezerra द्वारा प्रदान किया जाता है। गेम में खाता, लॉगिन या पंजीकरण आवश्यक नहीं है और डेवलपर अपना गेम सर्वर संचालित नहीं करता।'],
['2. डिवाइस पर संग्रहीत डेटा','गेम आपके डिवाइस पर प्रगति, अनलॉक स्तर व परिणाम, सिक्के, जीवन, बूस्टर, इन्वेंट्री, प्राथमिकताएँ, गोपनीयता-सहमति विकल्प और ऐप में भेजी गई प्रतिक्रिया स्थानीय रूप से सहेजता है। यह जानकारी गेम चलाने के लिए है और डेवलपर के अपने सर्वर पर नहीं भेजी जाती। ऐप डेटा हटाकर या ऐप अनइंस्टॉल करके इसे मिटाया जा सकता है।'],
['3. विज्ञापन और सहमति','Arrow Puzzle गेमप्ले के दौरान एक बैनर दिखाता है और वैकल्पिक रिवॉर्ड विज्ञापन केवल तब देता है जब आप Game Over के बाद जीवन वापस लेने, स्तर के बाद सिक्के पाने या स्टोर में 100 सिक्के पाने का चुनाव करते हैं। स्क्रीन या स्तर बदलते समय स्वचालित इंटरस्टीशियल विज्ञापन नहीं दिखाए जाते। विज्ञापन Google AdMob देता है। जहाँ आवश्यक हो, आप मैं → गोपनीयता प्राथमिकताएँ → सहमति प्रबंधित करें में अपनी पसंद देख या बदल सकते हैं।'],
['4. Google AdMob द्वारा संसाधित जानकारी','Google और AdMob तकनीकी जानकारी एकत्र और/या साझा कर सकते हैं, जैसे IP पते से अनुमानित स्थान, ऐप व विज्ञापन इंटरैक्शन, निदान व प्रदर्शन जानकारी तथा डिवाइस या विज्ञापन पहचानकर्ता। इसका उपयोग विज्ञापन, मापन व विश्लेषण, सुरक्षा, धोखाधड़ी रोकने और कानूनी अनुपालन के लिए हो सकता है। ट्रांसमिशन सुरक्षित होता है। <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google गोपनीयता नीति</a> और <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">Google विज्ञापन जानकारी</a> देखें।'],
['5. खरीदारी','वैकल्पिक खरीदारी Google Play द्वारा संसाधित होती है। डेवलपर को आइटम देने और सत्यापित करने के लिए उत्पाद पहचानकर्ता, लेन-देन स्थिति और तकनीकी खरीद या ऑर्डर पहचानकर्ता मिल सकते हैं। गेम आपके पूर्ण कार्ड या बैंक विवरण प्राप्त या संग्रहीत नहीं करता।'],
['6. संपर्क, प्रतिक्रिया, समीक्षाएँ और साझा करना','संपर्क आपके ई-मेल ऐप को contact@adrianobr.com पहले से भरे हुए पते के साथ खोलता है; संदेश भेजना आपका निर्णय है। प्रतिक्रिया स्थानीय रूप से सहेजी जाती है। समीक्षा विकल्प Google Play खोलता है और साझा करना केवल आपके चुनने पर Android शेयर मेनू खोलता है।'],
['7. प्रतिधारण, सुरक्षा और अधिकार','स्थानीय गेम डेटा आपके हटाने तक डिवाइस पर रहता है। Google अपने नियमों के अनुसार डेटा रखता है। प्रश्न या लागू गोपनीयता अधिकारों के लिए contact@adrianobr.com पर लिखें।'],
['8. बच्चे, बदलाव और संपर्क','गेम सामान्य दर्शकों के लिए है, बच्चों से जानबूझकर व्यक्तिगत डेटा एकत्र नहीं करता और इसमें उपयोगकर्ता खाते नहीं हैं। गेम बदलने पर यह नीति अपडेट की जा सकती है। संपर्क: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
id:{lang:'id',title:'Kebijakan Privasi',updated:'Terakhir diperbarui: 9 Oktober 2026',intro:'Kebijakan Privasi ini menjelaskan cara Arrow Puzzle (paket com.adrianobr.arrowpuzzle) menangani informasi saat Anda menggunakan game.',sections:[
['1. Pengendali dan cakupan','Arrow Puzzle disediakan oleh Adriano Bezerra. Game tidak memerlukan akun, login, atau pendaftaran, dan pengembang tidak mengoperasikan server game sendiri.'],
['2. Data yang disimpan di perangkat','Game menyimpan secara lokal di perangkat Anda kemajuan, level dan hasil yang terbuka, koin, nyawa, booster, inventaris, preferensi, pilihan persetujuan privasi, dan umpan balik dalam aplikasi. Informasi ini dipakai untuk menjalankan game dan tidak dikirim ke server milik pengembang. Anda dapat menghapusnya dengan menghapus data aplikasi atau mencopot pemasangan aplikasi.'],
['3. Iklan dan persetujuan','Arrow Puzzle menampilkan banner saat bermain dan menawarkan iklan berhadiah opsional hanya ketika Anda memilih memulihkan nyawa setelah Game Over, mendapatkan koin setelah level, atau memperoleh 100 koin di toko. Tidak ada iklan interstisial otomatis saat berpindah layar atau level. Iklan disediakan oleh Google AdMob. Bila diperlukan, Anda dapat meninjau atau mengubah pilihan pada Saya → Preferensi privasi → Kelola persetujuan.'],
['4. Informasi yang diproses Google AdMob','Google dan AdMob dapat mengumpulkan dan/atau membagikan informasi teknis seperti lokasi perkiraan dari alamat IP, interaksi iklan dan aplikasi, diagnostik dan kinerja, serta pengenal perangkat atau iklan. Informasi ini dapat digunakan untuk iklan, pengukuran dan analitik, keamanan, pencegahan penipuan, serta kepatuhan hukum. Transmisi dilindungi. Lihat <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Kebijakan Privasi Google</a> dan <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">informasi iklan Google</a>.'],
['5. Pembelian','Pembelian opsional diproses oleh Google Play. Pengembang dapat menerima pengenal produk, status transaksi, serta pengenal teknis pembelian atau pesanan untuk memberikan dan memvalidasi item. Game tidak menerima atau menyimpan data kartu atau bank lengkap.'],
['6. Kontak, umpan balik, ulasan, dan berbagi','Kontak membuka aplikasi email dengan contact@adrianobr.com terisi; Anda memutuskan apakah akan mengirim pesan. Umpan balik disimpan secara lokal. Ulasan membuka Google Play, dan berbagi membuka menu Android hanya ketika Anda memilihnya.'],
['7. Penyimpanan, keamanan, dan hak','Data game lokal berada di perangkat hingga Anda menghapusnya. Google menyimpan data sesuai kebijakannya sendiri. Anda dapat mengajukan pertanyaan atau menggunakan hak privasi yang berlaku melalui contact@adrianobr.com.'],
['8. Anak-anak, perubahan, dan kontak','Game ditujukan untuk khalayak umum, tidak dengan sengaja mengumpulkan data pribadi anak-anak, dan tidak memiliki akun pengguna. Kebijakan ini dapat diperbarui bila game berubah. Kontak: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
ru:{lang:'ru',title:'Политика конфиденциальности',updated:'Последнее обновление: 9 октября 2026 г.',intro:'Эта Политика конфиденциальности объясняет, как Arrow Puzzle (пакет com.adrianobr.arrowpuzzle) обрабатывает информацию при использовании игры.',sections:[
['1. Оператор и область действия','Arrow Puzzle предоставляется Адриано Безерра. Игра не требует учётной записи, входа или регистрации, а разработчик не управляет собственным игровым сервером.'],
['2. Данные, хранящиеся на устройстве','Игра локально хранит на вашем устройстве прогресс, открытые уровни и результаты, монеты, жизни, усилители, инвентарь, настройки, выбор согласия на обработку данных и отзывы, отправленные в приложении. Эта информация нужна для работы игры и не отправляется на собственный сервер разработчика. Вы можете удалить её, очистив данные приложения или удалив приложение.'],
['3. Реклама и согласие','Arrow Puzzle показывает баннер во время игры и предлагает дополнительные вознаграждаемые объявления только когда вы выбираете восстановить жизнь после Game Over, получить монеты после уровня или получить 100 монет в магазине. Автоматические межстраничные объявления при переходе между экранами или уровнями не показываются. Рекламу предоставляет Google AdMob. При необходимости вы можете просмотреть или изменить свой выбор: Я → Настройки конфиденциальности → Управление согласием.'],
['4. Информация, обрабатываемая Google AdMob','Google и AdMob могут собирать и/или передавать техническую информацию: примерное местоположение по IP-адресу, взаимодействия с рекламой и приложением, данные диагностики и производительности, а также идентификаторы устройства или рекламы. Она может использоваться для рекламы, измерений и аналитики, безопасности, предотвращения мошенничества и соблюдения закона. Передача защищена. См. <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Политику конфиденциальности Google</a> и <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">сведения Google о рекламе</a>.'],
['5. Покупки','Необязательные покупки обрабатываются Google Play. Разработчик может получить идентификатор продукта, статус транзакции и технические идентификаторы покупки или заказа, необходимые для предоставления и проверки предмета. Игра не получает и не хранит полные данные банковской карты или счёта.'],
['6. Контакт, отзывы, оценки и обмен','Контакт открывает ваше почтовое приложение с заполненным адресом contact@adrianobr.com; отправлять ли сообщение, решаете вы. Отзывы хранятся локально. Оценка открывает Google Play, а обмен — меню Android только по вашему выбору.'],
['7. Хранение, безопасность и права','Локальные игровые данные остаются на устройстве до их удаления. Google хранит данные по собственным правилам. Вопросы или запросы о применимых правах на конфиденциальность можно направить на contact@adrianobr.com.'],
['8. Дети, изменения и контакт','Игра предназначена для широкой аудитории, намеренно не собирает персональные данные детей и не имеет учётных записей пользователей. Политика может обновляться при изменении игры. Контакт: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]},
tr:{lang:'tr',title:'Gizlilik Politikası',updated:'Son güncelleme: 9 Ekim 2026',intro:'Bu Gizlilik Politikası, Arrow Puzzle’ın (paket com.adrianobr.arrowpuzzle) oyunu kullandığınızda bilgileri nasıl işlediğini açıklar.',sections:[
['1. Sorumlu ve kapsam','Arrow Puzzle, Adriano Bezerra tarafından sunulur. Oyun hesap, oturum açma veya kayıt gerektirmez; geliştirici kendi oyun sunucusunu işletmez.'],
['2. Cihazda saklanan veriler','Oyun ilerlemeyi, açılan seviyeleri ve sonuçları, paraları, canları, güçlendiricileri, envanteri, tercihleri, gizlilik onayı seçimlerini ve uygulama içi geri bildirimleri cihazınızda yerel olarak saklar. Bu bilgiler oyunun çalışması için kullanılır ve geliştiricinin kendi sunucusuna gönderilmez. Uygulama verilerini temizleyerek veya uygulamayı kaldırarak silebilirsiniz.'],
['3. Reklamlar ve onay','Arrow Puzzle oyun sırasında bir banner gösterir ve yalnızca Game Over sonrası can geri alma, seviye sonrasında para kazanma veya mağazada 100 para alma seçeneğini seçtiğinizde isteğe bağlı ödüllü reklamlar sunar. Ekranlar veya seviyeler arasında gezinirken otomatik geçiş reklamları göstermez. Reklamlar Google AdMob tarafından sağlanır. Gerektiğinde Ben → Gizlilik tercihleri → Onayı yönet bölümünden seçimlerinizi inceleyebilir veya değiştirebilirsiniz.'],
['4. Google AdMob tarafından işlenen bilgiler','Google ve AdMob; IP adresinden çıkarılan yaklaşık konum, reklam ve uygulama etkileşimleri, tanılama ve performans bilgileri ile cihaz veya reklam tanımlayıcıları gibi teknik bilgileri toplayabilir ve/veya paylaşabilir. Bunlar reklam, ölçüm ve analiz, güvenlik, dolandırıcılığı önleme ve yasal uyum için kullanılabilir. Aktarım korunur. <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Gizlilik Politikası</a> ve <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">Google reklam bilgileri</a> sayfalarına bakın.'],
['5. Satın alımlar','İsteğe bağlı satın alımlar Google Play tarafından işlenir. Geliştirici, öğeyi vermek ve doğrulamak için ürün kimliğini, işlem durumunu ve teknik satın alma veya sipariş kimliklerini alabilir. Oyun tam kart veya banka bilgilerinizi almaz ya da saklamaz.'],
['6. İletişim, geri bildirim, değerlendirme ve paylaşma','İletişim, alıcısı contact@adrianobr.com olan e-posta uygulamanızı açar; mesajı gönderip göndermeyeceğinize siz karar verirsiniz. Geri bildirim yerel olarak saklanır. Değerlendirme Google Play’i, paylaşma ise yalnızca seçtiğinizde Android paylaşım menüsünü açar.'],
['7. Saklama, güvenlik ve haklar','Yerel oyun verileri siz silene kadar cihazınızda kalır. Google verileri kendi politikalarına göre saklar. Sorularınızı veya geçerli gizlilik haklarına ilişkin taleplerinizi contact@adrianobr.com adresine iletebilirsiniz.'],
['8. Çocuklar, değişiklikler ve iletişim','Oyun genel kitleye yöneliktir, çocukların kişisel verilerini bilerek toplamaz ve kullanıcı hesabı içermez. Oyun değişirse bu politika güncellenebilir. İletişim: <a href="mailto:contact@adrianobr.com">contact@adrianobr.com</a>.'] ]}
};
const aliases={'pt-br':'ptBR','pt-pt':'ptPT','en':'en','en-us':'en','es':'es','es-419':'es','fr':'fr','fr-fr':'fr','de':'de','de-de':'de','it':'it','it-it':'it','hi':'hi','hi-in':'hi','id':'id','ru':'ru','ru-ru':'ru','tr':'tr','tr-tr':'tr'};
function selectPolicy(){const langs=(navigator.languages||[navigator.language||'en']).map(x=>x.toLowerCase());for(const l of langs){if(aliases[l])return aliases[l];const base=l.split('-')[0];if(aliases[base])return aliases[base]}return'en'}
function render(){const p=policies[selectPolicy()];document.documentElement.lang=p.lang;document.title='Arrow Puzzle — '+p.title;const sections=p.sections.map(([h,b])=>`<section><h2>${h}</h2><p>${b}</p></section>`).join('');document.querySelector('#policy').innerHTML=`<div class="brand"><span class="mark">➜</span><span>ARROW PUZZLE</span></div><h1>${p.title}</h1><p class="updated">${p.updated}</p><div class="notice">${p.intro}</div>${sections}<p class="footer">Arrow Puzzle · ${common.pkg} · <a href="mailto:${common.email}">${common.email}</a></p>`}render();
</script>
